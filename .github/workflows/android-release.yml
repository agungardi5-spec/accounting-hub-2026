name: Build Accounting Hub Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Create signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/accounting-hub-release.jks"

          test -s "$RUNNER_TEMP/accounting-hub-release.jks"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/accounting-hub-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          UNSIGNED=$(find android/app/build/outputs/apk/release -type f -name '*release-unsigned.apk' | head -n 1)

          if [ -z "$UNSIGNED" ]; then
            echo "Unsigned APK not found."
            find android/app/build/outputs/apk -type f -print
            exit 1
          fi

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" -f 4 \
            "$UNSIGNED" \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/accounting-hub-2026-release.apk" \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "$GITHUB_WORKSPACE/accounting-hub-2026-release.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: accounting-hub-2026-release-apk
          path: accounting-hub-2026-release.apk
          if-no-files-found: error
